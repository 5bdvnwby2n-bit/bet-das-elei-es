<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Votação</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
    }

    .container {
      width: min(92%, 420px);
      background: white;
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #222;
    }

    .subtitulo {
      color: #666;
      margin-bottom: 25px;
    }

    .opcao {
      position: relative;
      margin: 15px 0;
    }

    button {
      width: 100%;
      padding: 18px;
      border: 0;
      border-radius: 14px;
      font-size: 20px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      touch-action: pan-y;
      transition: transform .25s, opacity .25s;
    }

    #lula {
      background: #16803c;
    }

    #bolsonaro {
      background: #1769aa;
    }

    .arrastando {
      transition: none;
    }

    .resultado {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
      color: #333;
    }

    .votos {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 18px;
    }

    #mensagem {
      min-height: 24px;
      margin-top: 15px;
      font-weight: bold;
      color: #555;
    }
  </style>
</head>

<body>

  <main class="container">
    <h1>Votação</h1>
    <p class="subtitulo">Escolha uma das opções</p>

    <div class="opcao">
      <button id="lula">Lula</button>
    </div>

    <div class="opcao">
      <button id="bolsonaro">Bolsonaro</button>
    </div>

    <div id="mensagem"></div>

    <section class="resultado">
      <strong>Resultado</strong>

      <div class="votos">
        <span>Lula: <b id="votosLula">0</b></span>
        <span>Bolsonaro: <b id="votosBolsonaro">0</b></span>
      </div>
    </section>
  </main>

  <script>
    let votosLula = 0;
    let votosBolsonaro = 0;

    const lula = document.getElementById("lula");
    const bolsonaro = document.getElementById("bolsonaro");

    function votar(candidato) {
      if (candidato === "Lula") {
        votosLula++;
        document.getElementById("votosLula").textContent = votosLula;
      } else {
        votosBolsonaro++;
        document.getElementById("votosBolsonaro").textContent = votosBolsonaro;
      }

      document.getElementById("mensagem").textContent =
        "Voto registrado para " + candidato + ".";
    }

    lula.addEventListener("click", () => votar("Lula"));
    bolsonaro.addEventListener("click", () => votar("Bolsonaro"));

    // Suporte a arrastar o botão Bolsonaro.
    let inicioX = 0;
    let arrastando = false;

    bolsonaro.addEventListener("pointerdown", (e) => {
      inicioX = e.clientX;
      arrastando = true;
      bolsonaro.classList.add("arrastando");
      bolsonaro.setPointerCapture(e.pointerId);
    });

    bolsonaro.addEventListener("pointermove", (e) => {
      if (!arrastando) return;

      const deslocamento = e.clientX - inicioX;

      if (deslocamento > 0) {
        bolsonaro.style.transform =
          `translateX(${Math.min(deslocamento, 300)}px)`;
      }
    });

    bolsonaro.addEventListener("pointerup", (e) => {
      if (!arrastando) return;

      const deslocamento = e.clientX - inicioX;

      arrastando = false;
      bolsonaro.classList.remove("arrastando");

      if (deslocamento > 120) {
        votar("Bolsonaro");
      }

      bolsonaro.style.transform = "";
    });
  </script>

</body>
</html>
